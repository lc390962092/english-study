<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="英文歌词学习 - 逐句高亮 + 生词收藏">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="歌词学习">
    <title>歌词学习 - English Study</title>
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
    <link rel="stylesheet" href="css/common.css?v=5">
    <style>
        /* ===== 歌词学习页面样式 ===== */
        .lyrics-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部信息 */
        .song-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .song-artwork {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .song-artwork img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .song-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 控制按钮 */
        .player-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .control-btn.primary {
            background: var(--primary-grad);
            color: white;
        }

        .control-btn.active {
            background: var(--primary-soft);
            color: var(--primary-text);
            border: 2px solid var(--primary);
        }

        .control-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 歌词显示区 */
        .lyrics-display {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--shadow);
            min-height: 400px;
        }

        .lyrics-line {
            padding: 14px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 17px;
            line-height: 1.6;
            color: var(--text);
            position: relative;
        }

        .lyrics-line:hover {
            background: var(--surface-2);
        }

        .lyrics-line.active {
            background: var(--primary-soft);
            color: var(--primary-text);
            font-weight: 600;
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .lyrics-line.played {
            color: var(--text-secondary);
        }

        .lyrics-line .line-number {
            position: absolute;
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .lyrics-line:hover .line-number {
            opacity: 1;
        }

        .lyrics-line .word {
            cursor: pointer;
            padding: 2px 3px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .lyrics-line .word:hover {
            background: var(--warning-soft);
        }

        .lyrics-line .word.saved {
            background: var(--success-soft);
            color: var(--success-text);
        }

        /* 段落标签 */
        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px;
            padding-left: 16px;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state-desc {
            font-size: 14px;
            line-height: 1.6;
        }

        /* 加载状态 */
        .loading-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 进度条 */
        .progress-container {
            padding: 16px 20px;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-grad);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* 生词弹窗 */
        .word-popup {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 1000;
            max-height: 70vh;
            overflow-y: auto;
        }

        .word-popup.show {
            transform: translateY(0);
        }

        .word-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 999;
        }

        .word-popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .word-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .word-popup-word {
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
        }

        .word-popup-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: var(--bg-secondary);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-popup-phonetic {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .word-popup-meaning {
            font-size: 16px;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .word-popup-actions {
            display: flex;
            gap: 12px;
        }

        .word-popup-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .word-popup-btn.primary {
            background: var(--primary-grad);
            color: white;
        }

        .word-popup-btn.secondary {
            background: var(--bg-secondary);
            color: var(--text);
        }

        /* 生词本侧边栏 */
        .vocab-sidebar {
            position: fixed;
            top: 0;
            right: -350px;
            width: 350px;
            height: 100%;
            background: var(--surface);
            box-shadow: -4px 0 30px rgba(0,0,0,0.1);
            transition: right 0.3s;
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

        .vocab-sidebar.show {
            right: 0;
        }

        .vocab-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-title {
            font-size: 18px;
            font-weight: bold;
        }

        .vocab-close {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: var(--bg-secondary);
            cursor: pointer;
        }

        .vocab-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .vocab-item {
            padding: 12px;
            background: var(--surface-2);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vocab-word {
            font-weight: 600;
            color: var(--text);
        }

        .vocab-meaning {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .vocab-delete {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            background: var(--danger-soft);
            color: var(--danger);
            cursor: pointer;
            font-size: 14px;
        }

        .vocab-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .song-header {
                padding: 16px;
            }

            .song-artwork {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }

            .song-title {
                font-size: 17px;
            }

            .lyrics-display {
                padding: 20px 16px;
            }

            .lyrics-line {
                font-size: 16px;
                padding: 12px;
            }

            .vocab-sidebar {
                width: 100%;
                right: -100%;
            }
        }

        /* 深色模式微调 */
        @media (prefers-color-scheme: dark) {
            .lyrics-line.active {
                background: rgba(102, 126, 234, 0.2);
            }
        }

        [data-theme="dark"] .lyrics-line.active {
            background: rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <div class="header" style="display: flex; align-items: center; gap: 12px;">
        <a href="index.html" class="back-btn" style="color: var(--text); text-decoration: none; font-size: 24px;">←</a>
        <div>
            <h1 style="font-size: 24px; margin-bottom: 4px;">歌词学习</h1>
            <p style="font-size: 14px; color: var(--text-secondary);">逐句高亮 · 点击查词 · 生词收藏</p>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="lyrics-container">
        <!-- 加载状态 -->
        <div id="loadingState" class="loading-container">
            <div class="loading-spinner"></div>
            <p>正在加载歌词...</p>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">🎵</div>
            <div class="empty-state-title">暂无歌词文件</div>
            <div class="empty-state-desc">
                请将歌词 JSON 文件放入 <code>private/lyrics/</code> 目录<br>
                格式请参考模板文件
            </div>
        </div>

        <!-- 歌曲内容 -->
        <div id="songContent" style="display: none;">
            <!-- 歌曲信息 -->
            <div class="song-header">
                <div class="song-artwork" id="songArtwork">🎵</div>
                <div class="song-info">
                    <div class="song-title" id="songTitle">-</div>
                    <div class="song-artist" id="songArtist">-</div>
                    <div class="song-meta" id="songMeta">-</div>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="progress-container">
                <div class="progress-info">
                    <span class="progress-text" id="progressText">0 / 0</span>
                    <span class="progress-text" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <!-- 播放控制 -->
            <div class="player-controls">
                <button class="control-btn primary" id="playBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <span>播放</span>
                </button>
                <button class="control-btn" id="prevBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    <span>上一句</span>
                </button>
                <button class="control-btn" id="nextBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    <span>下一句</span>
                </button>
                <button class="control-btn" id="repeatBtn" title="循环播放当前句">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                    <span>循环</span>
                </button>
                <button class="control-btn" id="vocabBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 18l2 1V3c0-1.1-.9-2-2-2H8.99C7.89 1 7 1.9 7 3h10c1.1 0 2 .9 2 2v13zM15 5H5c-1.1 0-2 .9-2 2v16l7-3 7 3V7c0-1.1-.9-2-2-2z"/></svg>
                    <span>生词本 (<span id="vocabCount">0</span>)</span>
                </button>
            </div>

            <!-- 歌词显示 -->
            <div class="lyrics-display" id="lyricsDisplay"></div>
        </div>
    </div>

    <!-- 生词弹窗 -->
    <div class="word-popup-overlay" id="wordPopupOverlay"></div>
    <div class="word-popup" id="wordPopup">
        <div class="word-popup-header">
            <div class="word-popup-word" id="popupWord">-</div>
            <button class="word-popup-close" onclick="closeWordPopup()">×</button>
        </div>
        <div class="word-popup-phonetic" id="popupPhonetic"></div>
        <div class="word-popup-meaning" id="popupMeaning"></div>
        <div class="word-popup-actions">
            <button class="word-popup-btn secondary" onclick="speakWord()">🔊 发音</button>
            <button class="word-popup-btn primary" onclick="saveWord()">📌 收藏到生词本</button>
        </div>
    </div>

    <!-- 生词本侧边栏 -->
    <div class="vocab-sidebar" id="vocabSidebar">
        <div class="vocab-header">
            <div class="vocab-title">📚 生词本</div>
            <button class="vocab-close" onclick="toggleVocabSidebar()">×</button>
        </div>
        <div class="vocab-list" id="vocabList"></div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/lyrics.js"></script>
</body>
</html>
