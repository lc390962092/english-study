<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="English 英语学习应用，支持 A1-C1 词汇、语法学习与测试">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="English学习">
        <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="icon" type="image/png" href="icons/icon-96x96.png">
<title>English 词汇学习</title>
    <link rel="stylesheet" href="css/common.css?v=3">
    <style>
        /* 跳转弹窗（复用 grammar 页样式） */
        .jump-overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .jump-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .jump-modal {
            background: var(--surface);
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 22px 24px 30px;
            box-shadow: var(--shadow-lg);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .jump-overlay.active .jump-modal {
            transform: translateY(0);
        }
        .jump-modal h3 {
            font-size: 18px;
            margin-bottom: 6px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .jump-modal p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        .jump-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.25s, color 0.25s;
            margin-bottom: 8px;
        }
        .jump-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--ring);
        }
        .jump-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            min-height: 18px;
        }
        .jump-actions {
            display: flex;
            gap: 12px;
        }
        .jump-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .jump-actions button:active {
            transform: scale(0.97);
        }
        .jump-btn-primary {
            background: var(--primary-grad);
            color: white;
        }
        .jump-btn-secondary {
            background: var(--surface-3);
            color: var(--text);
            border: 1px solid var(--border) !important;
        }
        .btn-jump {
            background: var(--accent-5);
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="back">← 返回</a>
        <div class="level-title" id="levelTitle">A1</div>
        <div class="progress-info" id="progressInfo">0 / 0</div>
    </div>
    <div class="stage" id="stage">
        <div class="msg">加载中...</div>
    </div>

    <div class="jump-overlay" id="jumpOverlay" onclick="if(event.target===this) closeJump()">
        <div class="jump-modal">
            <h3>🔍 跳转到单词</h3>
            <p>输入序号（1~<span id="jumpTotal">0</span>）或关键词</p>
            <input type="text" class="jump-input" id="jumpInput" placeholder="例如：50 或 apple" autocomplete="off">
            <div class="jump-hint" id="jumpHint"></div>
            <div class="jump-actions">
                <button class="jump-btn-secondary" onclick="closeJump()">取消</button>
                <button class="jump-btn-primary" onclick="doJump()">跳转</button>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const level = params.get('level') || 'A1';
        const titleEl = document.getElementById('levelTitle');
        const progressEl = document.getElementById('progressInfo');
        const stageEl = document.getElementById('stage');
        titleEl.textContent = level;

        let words = [];
        let index = 0;
        let known = new Set();
        let autoFlip = localStorage.getItem('english_auto_flip') === 'true';
        let synth = window.speechSynthesis;
        let englishVoice = null;

        function findEnglishVoice() {
            const voices = synth.getVoices();
            for (const v of voices) {
                if (v.lang.startsWith('en')) { englishVoice = v; break; }
            }
        }
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = findEnglishVoice;
        }
        findEnglishVoice();

        function speak(text, rate = 0.85) {
            if (!synth) return;
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'en-US';
            utter.rate = rate;
            utter.pitch = 1.0;
            if (englishVoice) utter.voice = englishVoice;
            synth.speak(utter);
        }

        function loadProgress() {
            const saved = localStorage.getItem(`english_progress_${level}`);
            if (saved) known = new Set(JSON.parse(saved));
            autoFlip = localStorage.getItem('english_auto_flip') === 'true';
        }
        function saveProgress() {
            localStorage.setItem(`english_progress_${level}`, JSON.stringify([...known]));
        }

        function renderCardContent(w) {
            return {
                front: `
                    <div class="word">${w.word}</div>
                    <div class="accent">${w.pos} ${w.phonetic_us || w.phonetic_uk || ''}</div>
                    <div class="hint">点击卡片查看释义</div>
                `,
                back: `
                    <div class="word">${w.word}</div>
                    <div class="reading">${w.phonetic_us || w.phonetic_uk || ''}</div>
                    <div class="accent">${w.pos}</div>
                    <div class="meaning">${w.meaning}</div>
                    ${w.example ? `
                    <div class="sentence-box">
                        <div class="sentence">${w.example}</div>
                        <div class="sentence-meaning">${w.example_meaning || ''}</div>
                    </div>
                    ` : ''}
                `
            };
        }

        function cardHtml(w, cls) {
            const content = renderCardContent(w);
            const flipped = autoFlip ? 'flipped' : '';
            return `
                <div class="card ${cls} ${flipped}" data-id="${w.id}">
                    <div class="front-face">${content.front}</div>
                    <div class="back-face">${content.back}</div>
                </div>
            `;
        }

        function render() {
            if (!words.length) {
                stageEl.innerHTML = '<div class="msg">暂无词汇数据</div>';
                return;
            }
            if (index >= words.length) {
                stageEl.innerHTML = `
                    <div class="msg">
                        <h2>🎉 ${level} 已完成</h2>
                        <p>本轮共 ${words.length} 词，已掌握 ${known.size} 词</p>
                        <button class="btn btn-known" onclick="restart()" style="margin-top:20px;">重新开始</button>
                    </div>
                `;
                progressEl.textContent = `${known.size} / ${words.length}`;
                return;
            }
            const w = words[index];
            const nextW = words[index + 1];
            const isKnown = known.has(w.id);
            progressEl.textContent = `${index + 1} / ${words.length} · 已掌握 ${known.size}`;
            stageEl.innerHTML = `
                <div class="settings-bar">
                    <label class="setting-label">
                        <input type="checkbox" id="autoFlipCheck" ${autoFlip ? 'checked' : ''}>
                        默认展开释义
                    </label>
                </div>
                <div class="card-stack" id="cardStack">
                    ${nextW ? cardHtml(nextW, 'next') : ''}
                    ${cardHtml(w, 'current')}
                </div>
                <div class="btn-group">
                    <button class="btn btn-word" onclick="event.stopPropagation(); speakWord()">🔊 读音</button>
                    ${w.example ? `<button class="btn btn-sentence" onclick="event.stopPropagation(); speakSentence()">📝 例句</button>` : ''}
                    <button class="btn btn-jump" onclick="event.stopPropagation(); showJump()">🔍 跳转</button>
                    <button class="btn ${isKnown ? 'btn-unknown' : 'btn-known'}" onclick="event.stopPropagation(); toggleKnown()">${isKnown ? '取消掌握' : '✓ 掌握'}</button>
                </div>
                <div class="controls">
                    <button class="nav-btn" onclick="prev()" ${index === 0 ? 'disabled' : ''}>← 上一个</button>
                    <button class="nav-btn" onclick="next()">下一个 →</button>
                </div>
            `;

            const autoFlipCheck = document.getElementById('autoFlipCheck');
            if (autoFlipCheck) {
                autoFlipCheck.addEventListener('change', (e) => {
                    autoFlip = e.target.checked;
                    localStorage.setItem('english_auto_flip', autoFlip ? 'true' : 'false');
                    render();
                });
            }

            setupCardClick();
            setupSwipe();
        }

        function setupCardClick() {
            const card = document.querySelector('#cardStack .card.current');
            if (!card) return;
            card.addEventListener('click', (e) => {
                if (card.dataset.swiped === 'true') {
                    card.dataset.swiped = 'false';
                    return;
                }
                card.classList.toggle('flipped');
            });
        }

        function setupSwipe() {
            const card = document.querySelector('#cardStack .card.current');
            if (!card) return;

            let startX = 0;
            let currentX = 0;
            let isDragging = false;

            const onStart = (x) => {
                startX = x;
                currentX = x;
                isDragging = true;
                card.style.transition = 'none';
                card.dataset.swiped = 'false';
            };
            const onMove = (x) => {
                if (!isDragging) return;
                currentX = x;
                const dx = currentX - startX;
                card.style.transform = `translateX(${dx}px) rotate(${dx * 0.03}deg)`;
            };
            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                card.style.transition = '';
                const dx = currentX - startX;
                if (dx < -80) {
                    card.dataset.swiped = 'true';
                    card.classList.add('sliding-left');
                    setTimeout(next, 250);
                } else if (dx > 80) {
                    card.dataset.swiped = 'true';
                    card.classList.add('sliding-right');
                    setTimeout(prev, 250);
                } else {
                    card.style.transform = '';
                }
            };

            card.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
            card.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
            card.addEventListener('touchend', onEnd);

            card.addEventListener('mousedown', (e) => onStart(e.clientX));
            window.addEventListener('mousemove', (e) => onMove(e.clientX));
            window.addEventListener('mouseup', onEnd);
        }

        function flip() {
            const card = document.querySelector('#cardStack .card.current');
            if (card) card.classList.toggle('flipped');
        }

        function speakWord() {
            const w = words[index];
            speak(w.word, 0.9);
        }

        function speakSentence() {
            const w = words[index];
            if (w.example) speak(w.example, 0.9);
        }

        function toggleKnown() {
            const w = words[index];
            if (known.has(w.id)) known.delete(w.id);
            else known.add(w.id);
            saveProgress();
            render();
        }

        function next() {
            if (synth) synth.cancel();
            index++;
            render();
        }

        function prev() {
            if (synth) synth.cancel();
            if (index > 0) index--;
            render();
        }

        function restart() {
            index = 0;
            render();
        }

        function showJump() {
            const overlay = document.getElementById('jumpOverlay');
            const totalEl = document.getElementById('jumpTotal');
            const input = document.getElementById('jumpInput');
            const hint = document.getElementById('jumpHint');
            if (totalEl) totalEl.textContent = words.length;
            if (hint) hint.textContent = '';
            if (input) {
                input.value = '';
                input.addEventListener('input', updateJumpHint);
                input.addEventListener('keydown', onJumpKey);
            }
            overlay.classList.add('active');
            setTimeout(() => input && input.focus(), 50);
        }

        function closeJump() {
            const overlay = document.getElementById('jumpOverlay');
            const input = document.getElementById('jumpInput');
            overlay.classList.remove('active');
            if (input) {
                input.removeEventListener('input', updateJumpHint);
                input.removeEventListener('keydown', onJumpKey);
            }
        }

        function updateJumpHint() {
            const input = document.getElementById('jumpInput');
            const hint = document.getElementById('jumpHint');
            const raw = input.value.trim();
            if (!raw) {
                hint.textContent = '';
                return;
            }
            if (/^\d+$/.test(raw)) {
                const n = parseInt(raw, 10);
                if (n >= 1 && n <= words.length) {
                    hint.textContent = `将跳转到第 ${n} 条：${words[n - 1].word}`;
                    hint.style.color = 'var(--text-secondary)';
                } else {
                    hint.textContent = `请输入 1~${words.length} 之间的序号`;
                    hint.style.color = 'var(--danger-text)';
                }
                return;
            }
            const term = raw.toLowerCase();
            const matches = words.filter(w =>
                (w.word && w.word.toLowerCase().includes(term)) ||
                (w.meaning && w.meaning.toLowerCase().includes(term))
            );
            if (matches.length === 0) {
                hint.textContent = '未找到匹配的单词';
                hint.style.color = 'var(--danger-text)';
            } else {
                hint.textContent = `找到 ${matches.length} 条匹配，将跳转到第一条：${matches[0].word}`;
                hint.style.color = 'var(--text-secondary)';
            }
        }

        function onJumpKey(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                doJump();
            }
            if (e.key === 'Escape') {
                closeJump();
            }
        }

        function doJump() {
            const input = document.getElementById('jumpInput');
            const raw = input.value.trim();
            if (!raw) return;
            let target = -1;
            if (/^\d+$/.test(raw)) {
                const n = parseInt(raw, 10);
                if (n >= 1 && n <= words.length) target = n - 1;
            } else {
                const term = raw.toLowerCase();
                target = words.findIndex(w =>
                    (w.word && w.word.toLowerCase().includes(term)) ||
                    (w.meaning && w.meaning.toLowerCase().includes(term))
                );
            }
            if (target === -1) return;
            if (synth) synth.cancel();
            index = target;
            closeJump();
            render();
        }

        async function init() {
            loadProgress();
            const basePath = location.pathname.replace(/\/[^\/]*$/, '/');
            const resp = await fetch(`${basePath}content/${level}_words.json`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            words = await resp.json();
            render();
        }
        init().catch(err => {
            console.error('加载失败', err);
            stageEl.innerHTML = `<div class="msg">加载失败：${err.message}<br><button onclick="location.reload()" class="btn btn-primary" style="margin-top:16px;">刷新重试</button></div>`;
        });
    </script>
</body>
</html>
